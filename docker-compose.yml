services:
  url-shortener:
    build: .
    container_name: url-shortener
    env_file:
      - ./.env 
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:latest
    container_name: postgres
    env_file:
      - ./.env 
    ports:
      - "5432:5432"
    volumes:
      - postgresData:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgresData: